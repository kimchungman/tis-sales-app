<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIS Sales Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js" integrity="sha384-OJTwghM0Gh3Zc+gmd6l0lz1pFw9KuHHq0mSEZgmQEKgMnuSWWDb3bU9KzuD7w2hU" crossorigin="anonymous"></script>
<style>
:root{
  --navy:#0F172A; --blue:#2563EB; --blue-deep:#1D4ED8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;}
.shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0B1120 0%,#0F1B33 45%,#111827 100%);
  position:relative;overflow:hidden;
}
.shell::before{
  content:'';position:absolute;width:800px;height:800px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.15) 0%,transparent 70%);
  top:-300px;right:-200px;
}
.shell::after{
  content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,78,216,.12) 0%,transparent 70%);
  bottom:-250px;left:-150px;
}
.shell-card{position:relative;z-index:2;text-align:center;padding:40px;}
.brand-mark{
  width:64px;height:64px;border-radius:16px;margin:0 auto 24px;
  background:linear-gradient(155deg,#3B82F6 0%,#2563EB 45%,#1E40AF 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 40px -8px rgba(37,99,235,.55), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -12px 20px -8px rgba(0,0,0,.15);
  position:relative;border:1px solid rgba(255,255,255,.12);
}
.brand-mark::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(155deg,rgba(255,255,255,.18) 0%,transparent 55%);
  pointer-events:none;
}
.brand-mark svg{width:30px;height:30px;position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));}
.brand-name{color:#fff;font-size:21px;font-weight:800;letter-spacing:-0.4px;margin-bottom:9px;display:flex;align-items:baseline;justify-content:center;gap:9px;}
.brand-name .b-en{background:linear-gradient(135deg,#fff 20%,#BFDBFE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:0.5px;}
.brand-name .b-div{width:3px;height:3px;border-radius:50%;background:#3B5A8C;align-self:center;}
.brand-name .b-kr{color:#CBD5E1;font-size:21px;font-weight:500;letter-spacing:-0.3px;}
.brand-sub{color:#5B6B8C;font-size:10.5px;font-weight:600;letter-spacing:2.5px;margin-bottom:44px;text-transform:uppercase;}
.loading-ring{width:36px;height:36px;margin:0 auto 20px;border:3px solid rgba(255,255,255,.12);border-top-color:#2563EB;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.status-text{color:#CBD5E1;font-size:13px;font-weight:500;}
.status-sub{color:#64748B;font-size:11.5px;margin-top:6px;}
.state-manual{display:none;}
.login-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1E293B;border:none;padding:13px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .15s, box-shadow .15s;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.3);}
.login-btn svg{width:18px;height:18px;}
.manual-sub{color:#64748B;font-size:11.5px;margin-top:16px;}
.state-error{display:none;}
.error-box{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);border-radius:10px;padding:16px 20px;max-width:340px;}
.error-title{color:#FCA5A5;font-size:13px;font-weight:700;margin-bottom:6px;}
.error-msg{color:#94A3B8;font-size:11.5px;line-height:1.6;margin-bottom:14px;}
.retry-btn{background:#DC2626;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.shell-footer{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#3F4C63;font-size:10.5px;z-index:2;}
</style>
</head>
<body>

<div class="shell">
  <div class="shell-card">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 16.5L9.5 11L13.5 14.5L20 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 7H20V12" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4" cy="16.5" r="1.6" fill="#fff"/>
      </svg>
    </div>
    <div class="brand-name"><span class="b-en">TIS</span><span class="b-div"></span><span class="b-kr">영업관리시스템</span></div>
    <div class="brand-sub">TAK INFORMATION SYSTEMS</div>

    <div class="state-auto" id="state-auto">
      <div class="loading-ring"></div>
      <div class="status-text" id="status-text">계정 확인 중...</div>
      <div class="status-sub" id="status-sub">잠시만 기다려주세요</div>
    </div>

    <div class="state-manual" id="state-manual">
      <button class="login-btn" id="login-btn">
        <svg viewBox="0 0 23 23"><rect x="1" y="1" width="10" height="10" fill="#f25022"/><rect x="12" y="1" width="10" height="10" fill="#7fba00"/><rect x="1" y="12" width="10" height="10" fill="#00a4ef"/><rect x="12" y="12" width="10" height="10" fill="#ffb900"/></svg>
        Microsoft 계정으로 로그인
      </button>
      <div class="manual-sub">회사 계정으로 로그인해주세요</div>
    </div>

    <div class="state-error" id="state-error">
      <div class="error-box">
        <div class="error-title">연결에 실패했습니다</div>
        <div class="error-msg" id="error-msg">네트워크 상태를 확인하고 다시 시도해주세요.</div>
        <button class="retry-btn" id="retry-btn">다시 시도</button>
      </div>
    </div>
  </div>
  <div class="shell-footer">Powered by SharePoint</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// TIS 영업관리시스템 - 로그인 껍데기
// 이 파일은 로그인 화면만 담당하고, 실제 앱 전체(기능/데이터/로직)는
// SharePoint 문서 라이브러리에서 통째로 받아와 실행합니다.
// 파일명은 기존과 동일하게 유지해 Azure AD 리다이렉트 URI 설정을
// 전혀 건드리지 않아도 되도록 했습니다.
// ═══════════════════════════════════════════════════════════════════

var _SP_CONFIG = {
  clientId:    '1478baad-a9c0-4f5e-aa58-e168f5dd5d36',
  tenantId:    'd626830a-2676-4b41-aa6b-80ee7c719351',
  authority:   'https://login.microsoftonline.com/d626830a-2676-4b41-aa6b-80ee7c719351',
  siteUrl:     'https://tis21.sharepoint.com/sites/essales.tis.tm',
  redirectUri: 'https://kimchungman.github.io/tis-sales-app/TIS%20Sales%20Management%20System.html',
  scopes:      ['https://tis21.sharepoint.com/AllSites.Read']
};

// 실제 앱 파일이 저장된 SharePoint 경로
var APP_FILE_PATH = "/sites/essales.tis.tm/appsource/TIS Sales Management System.html";

function _setStatus(mainId, text, sub){
  var el = document.getElementById(mainId);
  if(el) el.textContent = text;
  if(sub){ var s=document.getElementById('status-sub'); if(s) s.textContent = sub; }
}
function _showState(which){
  document.getElementById('state-auto').style.display = which==='auto' ? 'block' : 'none';
  document.getElementById('state-manual').style.display = which==='manual' ? 'block' : 'none';
  document.getElementById('state-error').style.display = which==='error' ? 'block' : 'none';
}

var msalApp = null;

async function _initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: _SP_CONFIG.clientId,
      authority: _SP_CONFIG.authority,
      redirectUri: _SP_CONFIG.redirectUri
    },
    cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
  });
  await msalApp.initialize();
}

// 로그인 완료(또는 리다이렉트 복귀) 후, SharePoint에서 진짜 앱을 받아와 통째로 교체
async function _loadRealApp(account){
  try{
    _setStatus('status-text', '앱을 불러오는 중...', '잠시만 기다려주세요');
    _showState('auto');

    var tokenResp = await msalApp.acquireTokenSilent({
      scopes: _SP_CONFIG.scopes,
      account: account
    });

    var encodedPath = APP_FILE_PATH.split('/').map(encodeURIComponent).join('/');
    var fileUrl = _SP_CONFIG.siteUrl + "/_api/web/GetFileByServerRelativeUrl('" + encodedPath + "')/$value";
    var res = await fetch(fileUrl, {
      headers: { 'Authorization': 'Bearer ' + tokenResp.accessToken, 'Accept': 'text/plain' }
    });

    if(!res.ok){
      if(res.status === 401 || res.status === 403){
        throw new Error('로그인은 정상적으로 완료됐지만, 이 앱 데이터에 접근할 권한이 없습니다. 관리자에게 SharePoint 접근 권한 부여를 요청해주세요.');
      }
      throw new Error('SharePoint 파일을 불러오지 못했습니다 (HTTP ' + res.status + '). 파일 경로가 올바른지 확인해주세요.');
    }

    var appHtml = await res.text();
    if(!appHtml || appHtml.length < 1000){
      throw new Error('받아온 파일 내용이 비어있거나 너무 짧습니다. 업로드된 파일을 확인해주세요.');
    }

    // 문서 교체 직전 - 진짜 앱의 배경색으로 미리 자연스럽게 전환
    // (껍데기는 어두운 네이비, 실제 앱은 밝은 회색(#F8FAFC) 배경이라 그대로 교체하면
    //  전환 순간 화면이 갑자기 밝아지며 깜빡이는 느낌이 날 수 있어, 교체 직전에
    //  배경만 미리 앱 톤으로 부드럽게 바꿔둬서 이질감을 없앤다)
    document.body.style.transition = 'background-color 0.25s ease';
    document.body.style.backgroundColor = '#F8FAFC';
    await new Promise(function(r){ setTimeout(r, 260); });

    // 문서 전체를 진짜 앱으로 교체 - URL(쿼리스트링 포함 딥링크), MSAL 세션 캐시(sessionStorage) 모두 유지됨
    document.open();
    document.write(appHtml);
    document.close();
  }catch(e){
    console.error('[앱 로드 실패]', e);
    document.getElementById('error-msg').textContent = e.message || '알 수 없는 오류가 발생했습니다.';
    _showState('error');
  }
}

async function _tryLogin(){
  try{
    // 카카오톡/네이버 등 인앱 브라우저는 로그인 리다이렉트가 정상 작동하지 않는 경우가 많음 - 미리 안내
    var ua = navigator.userAgent || '';
    if(/KAKAOTALK|NAVER|Line|FBAN|FBAV|Instagram/i.test(ua)){
      document.getElementById('error-msg').textContent = '카카오톡·네이버 등 인앱 브라우저에서는 정상 작동하지 않을 수 있습니다. 우측 상단 메뉴에서 "다른 브라우저로 열기"를 눌러 Safari나 Chrome으로 열어주세요.';
      _showState('error');
      return;
    }
    if(typeof msal === 'undefined'){
      throw new Error('로그인 모듈을 불러오지 못했습니다. 사내망/방화벽에서 외부 스크립트가 차단되었을 수 있습니다. 잠시 후 다시 시도해주세요.');
    }
    await _initMsal();

    // 리다이렉트 로그인 후 돌아온 경우 처리
    var redirectResult;
    try{
      redirectResult = await msalApp.handleRedirectPromise();
    }catch(redirectErr){
      // ⚠ 이 지점에서 나는 실패는 SharePoint 이전 단계(순수 MS 로그인 단계)이므로,
      //   거의 대부분 "이 계정이 우리 회사(TIS) 테넌트 소속이 아니다"는 뜻이다.
      //   MSAL의 기술적인 원본 메시지(AADSTS 코드 등) 대신 이해하기 쉬운 안내로 변환.
      console.error('[테넌트 로그인 실패]', redirectErr);
      document.getElementById('error-msg').textContent = '이 계정은 TIS 회사 계정이 아니거나, 잘못된 계정으로 로그인하셨습니다. 회사 이메일 계정으로 다시 로그인해주세요.';
      _showState('error');
      return;
    }
    if(redirectResult && redirectResult.account){
      await _loadRealApp(redirectResult.account);
      return;
    }

    // 이미 로그인된 계정이 있는지 확인
    var accounts = msalApp.getAllAccounts();
    if(accounts.length > 0){
      await _loadRealApp(accounts[0]);
      return;
    }

    // 조용한 자동 로그인 시도 (브라우저에 회사 로그인 세션이 남아있으면 클릭 없이 통과)
    _setStatus('status-text', '계정 확인 중...', '잠시만 기다려주세요');
    try{
      var silentResult = await msalApp.ssoSilent({ scopes: _SP_CONFIG.scopes });
      if(silentResult && silentResult.account){
        await _loadRealApp(silentResult.account);
        return;
      }
    }catch(silentErr){
      console.log('[자동 로그인 불가] 수동 로그인 필요:', silentErr.errorCode);
    }

    // 자동 로그인 실패 - 수동 로그인 버튼 노출
    _showState('manual');
  }catch(e){
    console.error('[초기화 실패]', e);
    document.getElementById('error-msg').textContent = e.message || '초기화 중 오류가 발생했습니다.';
    _showState('error');
  }
}

document.getElementById('login-btn').addEventListener('click', function(){
  _showState('auto');
  _setStatus('status-text', '로그인 중...', 'Microsoft 로그인 화면으로 이동합니다');
  msalApp.loginRedirect({ scopes: _SP_CONFIG.scopes }).catch(function(e){
    console.error('[로그인 실패]', e);
    document.getElementById('error-msg').textContent = '로그인 페이지로 이동하지 못했습니다. 팝업 차단 설정을 확인하거나, 잠시 후 다시 시도해주세요.';
    _showState('error');
  });
});

document.getElementById('retry-btn').addEventListener('click', function(){
  _showState('auto');
  _setStatus('status-text', '다시 시도하는 중...', '');
  _tryLogin();
});

_tryLogin();
</script>
</body>
</html>
